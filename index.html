<!DOCTYPE html>
<html lang="en" id="dvHtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1877F2" id="dvMetaTheme">
<meta name="description" content="A personal growth companion that brings together spiritual reflection, self-discovery, intentional living, and purposeful development.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="Reflect &amp; Align">
<meta property="og:description" content="Reflect on your life purpose. Align with divine direction with daily reflection, bible reading, addicted with the name of Jesus Christ via puzzle game.">
<meta name="twitter:card" content="summary">
<link rel="canonical" id="dvCanonical" href="">
<link rel="manifest" id="dvManifestLink" href="manifest.json">
<title>Reflect &amp; Align</title>
<link rel="stylesheet" href="styles.css">
</head>
<body id="dvBody">

<!-- ===== HEADER ===== -->
<header class="dv-header" id="dvHeader">
  <button class="dv-icon-btn" id="dvHamburgerBtn" aria-label="Menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="dv-app-title">Reflect &amp; Align</div>
  <button class="dv-icon-btn" id="dvDotsBtn" aria-label="More options">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </button>
</header>

<!-- ===== OVERLAY ===== -->
<div class="dv-overlay" id="dvOverlay"></div>

<!-- ===== LEFT SIDEBAR ===== -->
<aside class="dv-sidebar-left" id="dvLeftSidebar">
  <div class="dv-sidebar-head">
    <button class="dv-icon-btn" id="dvCloseLeft" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <span>Menu</span>
  </div>
  <nav class="dv-sidebar-nav" id="dvLeftNav"></nav>
</aside>

<!-- ===== RIGHT SIDEBAR ===== -->
<div class="dv-sidebar-right" id="dvRightSidebar"></div>

<!-- ===== MAIN ===== -->
<main class="dv-container">

  <!-- PAGE: HOME -->
  <section class="dv-page dv-page-active" id="dvPageHome">

    <div class="dv-hero">
      <div class="dv-hero-title">Reflect &amp; Align</div>
      <div class="dv-hero-sub">Reflect on your life purpose. Align with divine direction with daily reflection, bible reading, addicted with the name of Jesus Christ via puzzle game.</div>
    </div>

    <!-- Quick Actions -->
    <div class="dv-card">
      <div class="dv-card-title">Quick Actions</div>
      <div class="dv-quick" id="dvQuickActions"></div>
    </div>

  </section>

</main>

<!-- ===== BOTTOM NAV ===== -->
<nav class="dv-bottom-nav" id="dvBottomNav">
  <button class="dv-nav-item dv-nav-active" data-dv-page="home" aria-label="Home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </button>
</nav>

<!-- ===== FULLSCREEN MODAL ===== -->
<div class="dv-modal" id="dvInfoModal">
  <div class="dv-modal-head">
    <div class="dv-modal-title" id="dvModalTitle"></div>
    <button class="dv-icon-btn" id="dvCloseModal" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="dv-modal-body" id="dvModalBody"></div>
</div>

<!-- ===== TOAST ===== -->
<div class="dv-toast" id="dvToast"></div>

<!-- ===== CORE ===== -->
<script src="app.js"></script>

<!-- ===== MODULES (optional: delete a file or its line and the app keeps working; add a line to onboard a new module) ===== -->
<script src="information.js"></script>
<script src="reflection.js"></script>
<script src="bible.js"></script>
<script src="game.js"></script>
<script src="notepad.js"></script>
</body>
</html>
